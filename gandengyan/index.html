  function startNewSession() {
    const oldSession = currentSession();
    if (!oldSession) return;
    oldSession.archived = true;
    const next = createSession(
      nextSessionName(state.sessions),
      oldSession.players.map((player) => ({ name: player.name, active: player.active }))
    );
    state.sessions.push(next);
    state.currentSessionId = next.id;
    ui.draft = newDraft('normal');
    ui.tab = 'summary';
    const saved = saveState();
    closeDialog();
    render();
    showToast(saved ? `${oldSession.name} 已归档，${next.name} 开始` : storageFailureText('已新开一场，但本机存储失败'), {
      label: '去记分',
      onClick: () => switchTab('entry')
    });
  }

  function togglePlayer(playerId) {
    const session = currentSession();
    if (!session) return;
    const player = session.players.find((item) => item.id === playerId);
    if (!player) return;
    player.active = !player.active;
    if (!player.active && ui.draft.winnerId === playerId) ui.draft.winnerId = null;
    const saved = saveState();
    render({ keepScroll: true });
    showToast(saved
      ? (player.active ? `已启用 ${player.name}` : `已停用 ${player.name}，历史分数保留`)
      : storageFailureText('已更新，但本机存储失败'));
  }

  function showFormError(elementId, message) {
    const element = document.getElementById(elementId);
    if (!element) return;
    element.hidden = false;
    element.textContent = message;
  }

  function clearFormError(elementId) {
    const element = document.getElementById(elementId);
    if (!element) return;
    element.hidden = true;
    element.textContent = '';
  }

  function handleInlineAddPlayer(form) {
    const input = form.querySelector('input[name="name"]');
    const result = addPlayer(input ? input.value : '');
    if (!result.ok) {
      showFormError('add-player-error', result.error);
      return;
    }
    clearFormError('add-player-error');
    render({ keepScroll: true });
    const nextInput = document.getElementById('add-player-input');
    if (nextInput) nextInput.focus();
    showToast(result.saved ? `已添加 ${result.player.name}` : storageFailureText('已添加，但本机存储失败'));
  }

  function handleDialogAddPlayer(form) {
    const input = form.querySelector('input[name="name"]');
    const result = addPlayer(input ? input.value : '');
    if (!result.ok) {
      showFormError('dialog-add-player-error', result.error);
      return;
    }
    closeDialog();
    render({ keepScroll: true });
    showToast(result.saved ? `已添加 ${result.player.name}` : storageFailureText('已添加，但本机存储失败'));
  }

  function handleRenamePlayer(form) {
    const playerId = form.dataset.playerId;
    const input = form.querySelector('input[name="name"]');
    const result = renamePlayer(playerId, input ? input.value : '');
    if (!result.ok) {
      showFormError('rename-player-error', result.error);
      return;
    }
    closeDialog();
    render({ keepScroll: true });
    showToast(result.saved ? '玩家姓名已更新' : storageFailureText('姓名已更新，但本机存储失败'));
  }

  function syncSignButton(button, playerName, negative) {
    if (!button) return;
    button.classList.toggle('is-negative', negative);
    button.textContent = negative ? '输 −' : '赢 +';
    button.setAttribute('aria-pressed', String(negative));
    if (playerName) {
      button.setAttribute('aria-label', `${playerName} 本局${negative ? '输' : '赢'}，点击切换`);
    }
  }

  function syncRowMultiplierControls(container, value, syncInput = true) {
    if (!container) return;
    const digits = sanitizeMultiplierDigits(value);
    container.querySelectorAll('.row-mult-btn').forEach((button) => {
      const active = digits === button.dataset.multiplier;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    const input = container.querySelector('[data-entry-row-multiplier]');
    if (input && syncInput) input.value = digits || '1';
  }

  document.addEventListener('click', (event) => {
    const trigger = event.target.closest('[data-action]');
    if (!trigger) return;
    const action = trigger.dataset.action;

    if (action === 'switch-tab') {
      switchTab(trigger.dataset.tab);
      return;
    }

    if (action === 'toggle-sign') {
      const playerId = trigger.dataset.playerId;
      const session = currentSession();
      if (!session) return;
      if (ui.draft.signs[playerId] === 1) {
        ui.draft.signs[playerId] = -1;
      } else {
        activePlayers(session).forEach((player) => {
          ui.draft.signs[player.id] = -1;
        });
        ui.draft.signs[playerId] = 1;
      }
      render({ keepScroll: true });
      return;
    }

    if (action === 'pick-amount') {
      const playerId = trigger.dataset.playerId;
      const amount = Number(trigger.dataset.amount);
      if (!AMOUNT_OPTIONS.includes(amount)) return;
      ui.draft.amounts[playerId] = String(amount);
      const picker = trigger.closest('.amount-picker');
      if (picker) {
        picker.querySelectorAll('.amount-option').forEach((button) => {
          const active = button.dataset.amount === String(amount);
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', String(active));
        });
      }
      updateEntryComputed();
      return;
    }

    if (action === 'set-row-multiplier') {
      const playerId = trigger.dataset.playerId;
      const multiplier = Number(trigger.dataset.multiplier);
      if (!ROW_MULTIPLIERS.includes(multiplier)) return;
      ui.draft.rowMultipliers[playerId] = String(multiplier);
      syncRowMultiplierControls(trigger.closest('.row-multiplier-controls'), String(multiplier));
      updateEntryComputed();
      return;
    }

    if (action === 'set-mode') {
      const mode = trigger.dataset.mode === 'quick' ? 'quick' : 'normal';
      if (ui.draft.mode !== mode) {
        ui.draft.mode = mode;
        render({ keepScroll: true });
      }
      return;
    }

    if (action === 'set-multiplier') {
      const multiplier = Number(trigger.dataset.multiplier);
      if (MULTIPLIERS.includes(multiplier)) {
        ui.draft.multiplier = multiplier;
        ui.draft.multiplierCustom = false;
        ui.draft.customMultiplier = String(multiplier);
        render({ keepScroll: true });
      }
      return;
    }

    if (action === 'set-custom-multiplier') {
      ui.draft.multiplierCustom = true;
      const multiplier = normalizeMultiplier(ui.draft.customMultiplier, ui.draft.multiplier || 1);
      ui.draft.multiplier = multiplier;
      ui.draft.customMultiplier = String(multiplier);
      render({ keepScroll: true });
      window.requestAnimationFrame(() => {
        const input = document.getElementById('custom-multiplier-input');
        if (input) {
          input.focus();
          input.select();
        }
      });
      return;
    }

    if (action === 'pick-winner') {
      const playerId = trigger.dataset.playerId;
      if (ui.draft.winnerId !== playerId) {
        ui.draft.winnerId = playerId;
        render({ keepScroll: true });
      }
      return;
    }

    if (action === 'save-round') {
      saveRound();
      return;
    }

    if (action === 'undo-last') {
      openUndoDialog();
      return;
    }

    if (action === 'edit-round') {
      openEditRound(trigger.dataset.roundId);
      return;
    }

    if (action === 'delete-round') {
      openDeleteRoundDialog(trigger.dataset.roundId);
      return;
    }

    if (action === 'confirm-delete-round') {
      deleteRoundById(trigger.dataset.roundId);
      return;
    }

    if (action === 'open-add-player') {
      openAddPlayerDialog();
      return;
    }

    if (action === 'rename-player') {
      openRenamePlayerDialog(trigger.dataset.playerId);
      return;
    }

    if (action === 'toggle-player') {
      togglePlayer(trigger.dataset.playerId);
      return;
    }

    if (action === 'delete-player') {
      openDeletePlayerDialog(trigger.dataset.playerId);
      return;
    }

    if (action === 'confirm-delete-player') {
      deletePlayerById(trigger.dataset.playerId);
      return;
    }

    if (action === 'delete-session') {
      openDeleteSessionDialog(trigger.dataset.sessionId);
      return;
    }

    if (action === 'confirm-delete-session') {
      deleteSessionById(trigger.dataset.sessionId);
      return;
    }

    if (action === 'new-session') {
      openNewSessionDialog();
      return;
    }

    if (action === 'confirm-new-session') {
      startNewSession();
      return;
    }

    if (action === 'view-archive') {
      openArchive(trigger.dataset.sessionId);
      return;
    }

    if (action === 'copy-session') {
      const session = sessionById(trigger.dataset.sessionId) || currentSession();
      copySettlement(session);
      return;
    }

    if (action === 'export-session') {
      const session = sessionById(trigger.dataset.sessionId) || currentSession();
      exportSessionCSV(session);
      return;
    }

    if (action === 'toggle-edit-sign') {
      const row = trigger.closest('[data-edit-row]');
      if (!row) return;
      const next = row.dataset.sign === '-1' ? 1 : -1;
      row.dataset.sign = String(next);
      syncSignButton(trigger, '', next < 0);
      updateEditComputed();
      return;
    }

    if (action === 'close-dialog') {
      closeDialog();
    }
  });

  document.addEventListener('input', (event) => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement)) return;

    if (target.matches('[data-entry-remaining]')) {
      const playerId = target.dataset.playerId;
      const digits = target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 6);
      target.value = digits;
      ui.draft.remaining[playerId] = digits;
      updateEntryComputed();
      return;
    }

    if (target.matches('[data-entry-row-multiplier]')) {
      const playerId = target.dataset.playerId;
      const digits = sanitizeMultiplierDigits(target.value);
      target.value = digits;
      ui.draft.rowMultipliers[playerId] = digits;
      syncRowMultiplierControls(target.closest('.row-multiplier-controls'), digits, false);
      updateEntryComputed();
      return;
    }

    if (target.id === 'custom-multiplier-input') {
      const digits = sanitizeMultiplierDigits(target.value);
      target.value = digits;
      ui.draft.customMultiplier = digits;
      ui.draft.multiplier = normalizeMultiplier(digits, 1);
      updateEntryComputed();
      return;
    }

    if (target.matches('[data-edit-amount]')) {
      const digits = target.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 6);
      target.value = digits;
      updateEditComputed();
      return;
    }

    if (target.id === 'add-player-input') clearFormError('add-player-error');
    if (target.id === 'dialog-add-player-input') clearFormError('dialog-add-player-error');
    if (target.id === 'rename-player-input') clearFormError('rename-player-error');
  });

  document.addEventListener('focusout', (event) => {
    const target = event.target;
    if (!(target instanceof HTMLInputElement)) return;

    if (target.matches('[data-entry-row-multiplier]')) {
      const playerId = target.dataset.playerId;
      const normalized = String(normalizeMultiplier(target.value, 1));
      ui.draft.rowMultipliers[playerId] = normalized;
      syncRowMultiplierControls(target.closest('.row-multiplier-controls'), normalized);
      updateEntryComputed();
      return;
    }

    if (target.id === 'custom-multiplier-input' && !target.value) {
      target.value = '1';
      ui.draft.customMultiplier = '1';
      ui.draft.multiplier = 1;
      updateEntryComputed();
    }
  });

  document.addEventListener('submit', (event) => {
    const form = event.target;
    if (!(form instanceof HTMLFormElement)) return;

    if (form.id === 'add-player-form') {
      event.preventDefault();
      handleInlineAddPlayer(form);
      return;
    }
    if (form.id === 'dialog-add-player-form') {
      event.preventDefault();
      handleDialogAddPlayer(form);
      return;
    }
    if (form.id === 'rename-player-form') {
      event.preventDefault();
      handleRenamePlayer(form);
      return;
    }
    if (form.id === 'edit-round-form') {
      event.preventDefault();
      saveEditedRound(form);
    }
  });

  setupManifest();
  render();
  if (!probeStorage()) {
    window.setTimeout(() => {
      showToast(`本机存储不可用：${storageFailureReason()}。${storageFailureHint()}。数据仅在当前页面有效。`, {
        label: '知道了',
        onClick: () => {}
      });
    }, 350);
  }
})();

  </script>
</body>
</html>
