<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="2;url=https://m0tao0.github.io/gandengyan-score/">
  <link rel="canonical" href="https://m0tao0.github.io/gandengyan-score/">
  <title>计分器已迁移 · 干瞪眼</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4efe4;
      --card: #fffdf8;
      --ink: #1d2a22;
      --muted: #647066;
      --accent: #17603c;
      --accent-ink: #ffffff;
      --line: #e4dccb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151a16;
        --card: #1e2620;
        --ink: #eef3ed;
        --muted: #a9b4ab;
        --accent: #6fd39d;
        --accent-ink: #0f1a13;
        --line: #334036;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(23, 96, 60, 0.12), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 420px);
      padding: 28px 24px 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 18px 48px rgba(20, 35, 25, 0.12);
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(23, 96, 60, 0.1);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(22px, 7vw, 28px);
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin: 22px 0 16px;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active {
      transform: translateY(1px);
      opacity: 0.92;
    }

    .btn:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .note {
      font-size: 13px;
    }

    .progress {
      height: 3px;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--line);
    }

    .progress span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      from { transform: translateX(-110%); }
      to { transform: translateX(360%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress span {
        width: 100%;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">干瞪眼计分器</span>
    <h1>计分器已迁移</h1>
    <p aria-live="polite">正在前往新地址，请稍候…</p>
    <a class="btn" href="https://m0tao0.github.io/gandengyan-score/">没反应？点这里前往</a>
    <p class="note">牌局记录保存在当前浏览器中，在新地址可以继续使用。</p>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
  <script>
    (function () {
      'use strict';

      var target = 'https://m0tao0.github.io/gandengyan-score/';
      var done = false;

      function go() {
        if (done) return;
        done = true;
        window.location.replace(target);
      }

      function unregisterOldServiceWorkers() {
        if (!('serviceWorker' in navigator)) {
          go();
          return;
        }

        var timeout = new Promise(function (resolve) {
          window.setTimeout(resolve, 800);
        });

        var cleanup = Promise.resolve()
          .then(function () {
            return navigator.serviceWorker.getRegistrations();
          })
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister().catch(function () {});
            }));
          })
          .catch(function () {});

        Promise.race([cleanup, timeout]).then(go, go);
      }

      unregisterOldServiceWorkers();
      window.setTimeout(go, 1600);
    })();
  </script>
</body>
</html>
