  <style>
    :root {
      --bg: #f3efe6;
      --bg-deep: #e7dfd0;
      --surface: #fdfbf6;
      --surface-2: #f2ecdf;
      --surface-3: #eae2d2;
      --ink: #17231d;
      --muted: #6b776f;
      --muted-2: #909b93;
      --line: #ded5c4;
      --line-strong: #cdc2ae;
      --green: #0d6b4f;
      --green-strong: #07533c;
      --green-soft: #e3f0e9;
      --positive: #0b7655;
      --red: #b53b32;
      --negative: #b53b32;
      --red-soft: #f8e6e2;
      --gold: #b98a2f;
      --gold-soft: #f7ecd2;
      --on-green: #ffffff;
      --shadow-sm: 0 1px 2px rgba(29, 42, 34, .04), 0 4px 12px rgba(29, 42, 34, .04);
      --shadow-md: 0 12px 28px rgba(29, 42, 34, .09);
      --shadow-lg: 0 24px 52px rgba(16, 35, 26, .18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1411;
        --bg-deep: #080e0b;
        --surface: #151f1a;
        --surface-2: #1b2821;
        --surface-3: #23332b;
        --ink: #eef4ef;
        --muted: #9eafa5;
        --muted-2: #7e9187;
        --line: #28382f;
        --line-strong: #35473d;
        --green: #52c596;
        --green-strong: #7bdcb5;
        --green-soft: #17382b;
        --positive: #65d4a6;
        --red: #f17c70;
        --negative: #f17c70;
        --red-soft: #3a211f;
        --gold: #dfb965;
        --gold-soft: #332a17;
        --on-green: #062016;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .2), 0 4px 12px rgba(0, 0, 0, .14);
        --shadow-md: 0 12px 28px rgba(0, 0, 0, .24);
        --shadow-lg: 0 24px 52px rgba(0, 0, 0, .4);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 0%, rgba(198, 150, 60, .1), transparent 26rem),
        var(--bg-deep);
      font-family: "SF Pro SC", "SF Pro Text", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
    }

    input,
    textarea {
      min-width: 0;
    }

    svg {
      display: block;
      flex: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 860px;
      height: 100vh;
      height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg);
    }

    .topbar {
      flex: none;
      z-index: 20;
      padding-top: env(safe-area-inset-top, 0px);
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 720px;
      min-height: 62px;
      margin: 0 auto;
      padding: 9px 16px;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .brand-mark {
      position: relative;
      display: grid;
      flex: none;
      place-items: center;
      width: 36px;
      height: 43px;
      border: 1px solid rgba(13, 107, 79, .2);
      border-radius: 8px;
      color: var(--green-strong);
      background: linear-gradient(150deg, #fffdf7, #eee3cb);
      box-shadow: 0 4px 10px rgba(50, 62, 49, .12);
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      transform: rotate(-4deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--red);
    }

    @media (prefers-color-scheme: dark) {
      .brand-mark {
        border-color: rgba(255, 255, 255, .1);
        background: linear-gradient(150deg, #f7ecd5, #d8c49c);
        color: #0a4a37;
      }
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text strong {
      display: block;
      overflow: hidden;
      font-size: 16px;
      font-weight: 850;
      letter-spacing: -.02em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-text small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .session-pill {
      display: inline-flex;
      flex: none;
      align-items: center;
      min-height: 44px;
      max-width: 158px;
      padding: 0 11px;
      gap: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .session-pill:active {
      transform: scale(.98);
    }

    .session-dot {
      flex: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .session-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-rounds {
      flex: none;
      padding: 3px 6px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 9px;
    }

    #main {
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 17px 16px 22px;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .view {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      animation: view-in .22s ease both;
    }

    @keyframes view-in {
      from { opacity: .3; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .view-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 0 1px 15px;
    }

    .view-head h1 {
      margin: 2px 0 3px;
      font-size: 27px;
      font-weight: 880;
      letter-spacing: -.045em;
      line-height: 1.15;
    }

    .view-sub {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .eyebrow {
      display: block;
      color: var(--green-strong);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .13em;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 19px 19px 16px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 24px;
      color: #f8f3e7;
      background:
        radial-gradient(circle at 88% 4%, rgba(226, 190, 106, .28), transparent 16rem),
        linear-gradient(143deg, #0d6b4f 0%, #084c39 56%, #07362a 100%);
      box-shadow: var(--shadow-lg);
    }

    .hero::before {
      content: "♦";
      position: absolute;
      top: -41px;
      right: 20px;
      color: rgba(255, 255, 255, .055);
      font-size: 152px;
      line-height: 1;
      transform: rotate(8deg);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -56px;
      bottom: -94px;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 50%;
      box-shadow: 0 0 0 26px rgba(255, 255, 255, .025), 0 0 0 52px rgba(255, 255, 255, .018);
    }

    .hero-top,
    .hero-main,
    .hero-stats {
      position: relative;
      z-index: 1;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: rgba(250, 246, 235, .68);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .hero-kicker::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d8b15e;
      box-shadow: 0 0 0 4px rgba(216, 177, 94, .13);
    }

    .hero-session {
      max-width: 46%;
      overflow: hidden;
      color: rgba(250, 246, 235, .58);
      font-size: 10px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-main {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 18px;
      gap: 14px;
    }

    .hero-label {
      display: block;
      margin-bottom: 4px;
      color: rgba(250, 246, 235, .62);
      font-size: 11px;
    }

    .hero-name {
      display: block;
      max-width: 100%;
      overflow: hidden;
      color: #fffdf6;
      font-size: 26px;
      font-weight: 850;
      letter-spacing: -.04em;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .hero-score {
      flex: none;
      color: #f3d691;
      font-size: 42px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.055em;
      line-height: .92;
    }

    .hero-score.is-negative {
      color: #ffb5aa;
    }

    .hero-score.is-empty {
      color: rgba(255, 255, 255, .35);
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 17px;
      padding-top: 13px;
      border-top: 1px solid rgba(255, 255, 255, .12);
    }

    .hero-stats > div + div {
      padding-left: 13px;
      border-left: 1px solid rgba(255, 255, 255, .1);
    }

    .hero-stats span {
      display: block;
      color: rgba(250, 246, 235, .55);
      font-size: 9px;
    }

    .hero-stats strong {
      display: block;
      margin-top: 3px;
      color: rgba(255, 253, 246, .94);
      font-size: 14px;
      font-weight: 800;
    }

    .hero-stats strong.good {
      color: #b8e8d3;
    }

    .summary-actions {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 16px;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      transition: transform .12s ease, opacity .12s ease, background-color .12s ease;
    }

    .btn:not(:disabled):active {
      transform: scale(.98);
    }

    .btn-primary {
      color: var(--on-green);
      background: var(--green);
      box-shadow: 0 8px 18px rgba(13, 107, 79, .2);
    }

    .btn-secondary {
      border-color: var(--line);
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .btn-ghost {
      border-color: transparent;
      color: var(--muted);
      background: transparent;
    }

    .btn-danger {
      color: #fff;
      background: var(--red);
      box-shadow: 0 8px 18px rgba(181, 59, 50, .18);
    }

    .btn:disabled {
      opacity: .4;
      box-shadow: none;
    }

    .btn-block {
      width: 100%;
    }

    .section-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .summary-card {
      margin-top: 14px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 15px 10px;
    }

    .card-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: -.015em;
    }

    .card-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .card-head .count {
      flex: none;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 9px;
      font-weight: 750;
    }

    .leader-list {
      margin: 0;
      padding: 0 7px 7px;
      list-style: none;
    }

    .leader-row {
      display: grid;
      grid-template-columns: 29px 38px minmax(0, 1fr) auto;
      align-items: center;
      min-height: 61px;
      padding: 7px 8px;
      gap: 8px;
      border-radius: 13px;
    }

    .leader-row + .leader-row {
      border-top: 1px solid var(--line);
    }

    .leader-row.is-leading {
      border-top-color: transparent;
      background: linear-gradient(90deg, var(--gold-soft), transparent 80%);
    }

    .rank {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .rank.podium-1 {
      color: #6e4a05;
      background: #f3dca4;
      box-shadow: inset 0 0 0 1px rgba(126, 86, 10, .08);
    }

    .rank.podium-2 {
      color: #4e5a58;
      background: #e2e8e5;
    }

    .rank.podium-3 {
      color: #70452c;
      background: #eed8c6;
    }

    @media (prefers-color-scheme: dark) {
      .rank.podium-1 { color: #2f2104; background: #d9b765; }
      .rank.podium-2 { color: #202926; background: #9fb0a9; }
      .rank.podium-3 { color: #2e1a10; background: #b98563; }
    }

    .avatar {
      display: grid;
      flex: none;
      place-items: center;
      width: 37px;
      height: 37px;
      border-radius: 12px;
      color: var(--avatar-fg, var(--green-strong));
      background: var(--avatar-bg, var(--green-soft));
      font-size: 14px;
      font-weight: 850;
      line-height: 1;
    }

    .tone-0 { --avatar-bg: #e4efe7; --avatar-fg: #17664b; }
    .tone-1 { --avatar-bg: #f6e9cf; --avatar-fg: #7a5715; }
    .tone-2 { --avatar-bg: #f5e3df; --avatar-fg: #983f34; }
    .tone-3 { --avatar-bg: #e6e9f3; --avatar-fg: #485a82; }
    .tone-4 { --avatar-bg: #eee4f1; --avatar-fg: #76517e; }
    .tone-5 { --avatar-bg: #e4eef0; --avatar-fg: #31636a; }

    @media (prefers-color-scheme: dark) {
      .tone-0 { --avatar-bg: #173a2c; --avatar-fg: #80d6b2; }
      .tone-1 { --avatar-bg: #362b16; --avatar-fg: #e0ba6a; }
      .tone-2 { --avatar-bg: #3a211e; --avatar-fg: #ef9a8e; }
      .tone-3 { --avatar-bg: #202a3e; --avatar-fg: #9eb7e9; }
      .tone-4 { --avatar-bg: #302238; --avatar-fg: #caa6d5; }
      .tone-5 { --avatar-bg: #183237; --avatar-fg: #8bd0d8; }
    }

    .player-block {
      min-width: 0;
    }

    .player-name {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 6px;
      overflow: hidden;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-name .name-text {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-meta {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      flex: none;
      align-items: center;
      min-height: 17px;
      padding: 1px 6px;
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 8px;
      font-weight: 750;
      line-height: 1;
    }

    .badge.green {
      color: var(--green-strong);
      background: var(--green-soft);
    }

    .badge.gold {
      color: var(--gold);
      background: var(--gold-soft);
    }

    .total {
      min-width: 58px;
      color: var(--muted);
      font-size: 21px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.045em;
      text-align: right;
      white-space: nowrap;
    }

    .pos { color: var(--positive) !important; }
    .neg { color: var(--negative) !important; }
    .zero { color: var(--muted) !important; }

    .list-foot {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px 12px;
      gap: 6px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
    }

    .list-foot svg {
      color: var(--green);
    }

    .notice {
      display: flex;
      align-items: flex-start;
      margin: 0 0 12px;
      padding: 11px 12px;
      gap: 9px;
      border: 1px solid rgba(185, 138, 47, .19);
      border-radius: 13px;
      color: #705418;
      background: var(--gold-soft);
      font-size: 11px;
      line-height: 1.55;
    }

    .notice svg {
      margin-top: 1px;
      flex: none;
    }

    .notice.danger {
      border-color: rgba(181, 59, 50, .16);
      color: var(--negative);
      background: var(--red-soft);
    }

    @media (prefers-color-scheme: dark) {
      .notice { color: #e1c27f; }
      .notice.danger { color: var(--negative); }
    }

    .empty {
      padding: 34px 20px;
      text-align: center;
    }

    .empty .empty-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin: 0 auto 11px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--green-strong);
      background: var(--surface-2);
      font-size: 21px;
      font-weight: 850;
      transform: rotate(-5deg);
    }

    .empty h3 {
      margin: 0 0 5px;
      font-size: 15px;
      font-weight: 850;
    }

    .empty p {
      max-width: 30em;
      margin: 0 auto;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .empty .btn {
      margin-top: 14px;
    }

    .local-note {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      gap: 6px;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 12px;
      padding: 4px;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface-2);
    }

    .mode-btn {
      min-height: 44px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      transition: background-color .15s ease, color .15s ease, box-shadow .15s ease;
    }

    .mode-btn.is-active {
      color: var(--ink);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .field-block {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      gap: 10px;
    }

    .field-label strong {
      font-size: 12px;
      font-weight: 850;
    }

    .field-label small {
      color: var(--muted);
      font-size: 9px;
    }

    .multiplier-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .multiplier-btn {
      min-height: 45px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 15px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .multiplier-btn.is-active {
      border-color: var(--green);
      color: var(--green-strong);
      background: var(--green-soft);
      box-shadow: inset 0 0 0 1px var(--green);
    }

    .custom-multiplier-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
      padding: 5px 6px 5px 12px;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 10px;
      font-weight: 700;
    }

    .custom-multiplier-wrap {
      display: flex;
      align-items: center;
      flex: none;
      gap: 4px;
      color: var(--green-strong);
      font-size: 13px;
      font-weight: 850;
    }

    .custom-multiplier-input {
      width: 72px;
      height: 44px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: 0;
      color: var(--ink);
      background: var(--surface);
      font-size: 17px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .custom-multiplier-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .entry-hint {
      margin: 0 1px 10px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.55;
    }

    .score-list {
      display: grid;
      gap: 8px;
    }

    .score-row {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 10px;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .score-row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-width: 0;
      gap: 8px;
    }

    .score-row-head > .player-block {
      flex: 1;
    }

    .score-row .player-block {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 9px;
    }

    .score-row .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 13px;
    }

    .amount-control {
      display: flex;
      align-items: center;
      padding: 3px;
      gap: 5px;
      border-radius: 12px;
      background: var(--surface-2);
    }

    .sign-btn {
      min-width: 47px;
      min-height: 44px;
      padding: 0 7px;
      border: 0;
      border-radius: 9px;
      color: #fff;
      background: var(--green);
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }

    .sign-btn.is-negative {
      background: var(--red);
    }

    .score-row.is-winner {
      border-color: var(--green);
      box-shadow: 0 3px 14px rgba(13, 107, 79, .08);
    }

    .winner-auto-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 11px;
      gap: 8px;
      border-radius: 11px;
      background: var(--green-soft);
    }

    .winner-auto-label {
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .winner-auto-value {
      font-size: 20px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .amount-picker {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .amount-option {
      flex: 1 1 0;
      min-width: 0;
      min-height: 44px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 15px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
    }

    .amount-option.is-active {
      border-color: var(--red);
      color: #fff;
      background: var(--red);
      box-shadow: 0 2px 8px rgba(184, 47, 47, .18);
    }

    .amount-input {
      width: 59px;
      height: 44px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: 0;
      color: var(--ink);
      background: var(--surface);
      font-size: 18px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .amount-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .amount-input:disabled {
      opacity: .5;
    }

    .amount-unit {
      padding-right: 1px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .row-multiplier-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 7px;
      border-top: 1px dashed var(--line);
    }

    .control-label {
      margin-right: auto;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      white-space: nowrap;
    }

    .row-mult-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .row-mult-btn.is-active {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-soft);
    }

    .row-mult-custom {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 4px 0 6px;
      gap: 1px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: var(--surface);
      font-size: 11px;
      font-weight: 850;
    }

    .row-multiplier-input {
      width: 34px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 13px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .row-multiplier-input:focus {
      background: var(--surface-2);
      box-shadow: 0 0 0 2px var(--green-soft);
    }

    .row-calc {
      min-height: 13px;
      padding: 0 2px;
      color: var(--muted);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .winner-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(91px, 1fr));
      gap: 7px;
    }

    .winner-chip {
      display: flex;
      align-items: center;
      min-height: 47px;
      padding: 0 10px;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--muted);
      background: var(--surface-2);
      font-size: 12px;
      font-weight: 750;
      text-align: left;
    }

      display: grid;
      flex: none;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;

      font-size: 10px;
      font-weight: 850;

      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .winner-chip.is-selected {
      border-color: var(--green);
      color: var(--green-strong);
      background: var(--green-soft);
      box-shadow: inset 0 0 0 1px var(--green);

    .winner-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 10px 0;
      padding: 13px 15px;

      border-radius: 16px;
      background: var(--green-soft);

      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    .winner-result strong {
      display: block;
      margin-top: 3px;
      font-size: 13px;
      font-weight: 850;

      color: var(--positive);
      font-size: 28px;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.04em;
      white-space: nowrap;

    .balance-bar {

      z-index: 8;

      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 11px;
      gap: 12px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(29, 42, 34, .16);

      padding-left: 3px;

      color: var(--muted);
      font-size: 9px;

    .balance-line {

    .archive-round-top {

<body>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand" aria-label="干瞪眼计分器">

            <strong>干瞪眼计分器</strong>
            <small>每一局，都算得清</small>
          </span>
        </div>
        <button class="session-pill" id="session-pill" type="button" data-action="switch-tab" data-tab="sessions" aria-label="查看场次">
          <span class="session-dot" aria-hidden="true"></span>
          <span class="session-name">第 1 场</span>
          <span class="session-rounds">0 局</span>
        </button>

  function icon(name, size = 20) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  }

  function uid(prefix) {
    try {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return `${prefix}_${window.crypto.randomUUID()}`;
      }
    } catch (_) {}
    return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 9)}`;
  }

  function nowISO() {
    return new Date().toISOString();
  }

  function normalizeDate(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? null : date.toISOString();
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch]));
  }

  function escapeAttr(value) {
    return escapeHTML(value);
  }

  function formatSigned(value) {
    const n = Number(value) || 0;
    if (n > 0) return `+${n}`;
    return String(n);
  }

  function normalizeMultiplier(value, fallback = 1) {
    const n = Math.round(Number(value));
    if (!Number.isFinite(n) || n < 1) return fallback;
    return Math.min(n, MAX_MULTIPLIER);
  }

  function sanitizeMultiplierDigits(value) {
    return String(value || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 3);
  }

  function scoreClass(value) {
    const n = Number(value) || 0;
    if (n > 0) return 'pos';
    if (n < 0) return 'neg';
    return 'zero';
  }

  function formatDateTime(value, full = false) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '时间未知';
    const year = date.getFullYear();
    const month = date.getMonth() + 1;
    const day = date.getDate();
    const hour = String(date.getHours()).padStart(2, '0');
    const minute = String(date.getMinutes()).padStart(2, '0');
    return full
      ? `${year}年${month}月${day}日 ${hour}:${minute}`
      : `${month}月${day}日 ${hour}:${minute}`;
  }

  function initialOf(name) {
    return Array.from(String(name || '?'))[0] || '?';
  }

  function toneFor(value) {
    const text = String(value || '');
    let hash = 0;
    for (const ch of Array.from(text)) {
      hash = (hash * 31 + (ch.codePointAt(0) || 0)) >>> 0;
    }
    return `tone-${hash % 6}`;
  }

  function newDraft(mode = 'normal') {
    return {

      multiplier: 1,
      customMultiplier: '',
      multiplierCustom: false,
      amounts: {},
      signs: {},
      rowMultipliers: {},
      winnerId: null,
      remaining: {}
    };

  function createSession(name, playerSeeds = []) {

      archived: false,
      players: playerSeeds.map((p) => createPlayer(p.name, p.active !== false)),
      rounds: []
    };
  }

  function createPlayer(name, active = true) {
    return {
      id: uid('p'),
      name,
      active: active !== false
    };
  }

  function sanitizeState(raw) {
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.sessions)) return null;

    const sessionIds = new Set();
    const sessions = [];

      if (session) {
        sessionIds.add(session.id);
        sessions.push(session);

    }
    if (!sessions.length) return null;

    let currentSessionId = typeof raw.currentSessionId === 'string' ? raw.currentSessionId : '';
    const isOpenCurrent = sessions.some((s) => s.id === currentSessionId && !s.archived);

        const freshSession = createSession(nextSessionName(sessions));
        sessions.push(freshSession);
        currentSessionId = freshSession.id;
      }
    }

    return { sessions, currentSessionId };
  }

  function sanitizeSession(raw, usedSessionIds) {
    if (!raw || typeof raw !== 'object') return null;

    let id = typeof raw.id === 'string' && raw.id.trim() ? raw.id.trim() : uid('s');
    if (usedSessionIds.has(id)) return null;

    const name = typeof raw.name === 'string' && raw.name.trim()
      ? raw.name.trim().slice(0, 40)
      : '未命名场次';
    const createdAt = normalizeDate(raw.createdAt) || nowISO();
    const archived = raw.archived === true;

    const playerIds = new Set();
    const players = [];
    if (Array.isArray(raw.players)) {
      for (const rawPlayer of raw.players) {
        if (!rawPlayer || typeof rawPlayer !== 'object') continue;
        let playerId = typeof rawPlayer.id === 'string' && rawPlayer.id.trim()
          ? rawPlayer.id.trim()
          : uid('p');
        if (playerIds.has(playerId)) continue;
        const playerName = typeof rawPlayer.name === 'string'
          ? rawPlayer.name.trim().slice(0, 16)
          : '';
        if (!playerName) continue;
        playerIds.add(playerId);
        players.push({
          id: playerId,
          name: playerName,
          active: rawPlayer.active !== false
        });
      }
    }

    const roundIds = new Set();
    const rounds = [];
    if (Array.isArray(raw.rounds)) {
      raw.rounds.forEach((rawRound, position) => {
        if (!rawRound || typeof rawRound !== 'object') return;
        let roundId = typeof rawRound.id === 'string' && rawRound.id.trim()
          ? rawRound.id.trim()
          : uid('r');
        if (roundIds.has(roundId)) roundId = uid('r');
        const time = normalizeDate(rawRound.time) || nowISO();
        const multiplier = normalizeMultiplier(rawRound.multiplier);

        const playerMultipliers = {};
        if (rawRound.playerMultipliers && typeof rawRound.playerMultipliers === 'object') {
          for (const [playerId, rawMultiplier] of Object.entries(rawRound.playerMultipliers)) {
            if (!playerIds.has(playerId)) continue;
            playerMultipliers[playerId] = normalizeMultiplier(rawMultiplier);
          }
        }

        const scores = {};
        if (rawRound.scores && typeof rawRound.scores === 'object') {
          for (const [playerId, rawScore] of Object.entries(rawRound.scores)) {
            if (!playerIds.has(playerId)) continue;
            const score = Number(rawScore);
            if (!Number.isFinite(score)) continue;
            scores[playerId] = Math.trunc(score);
          }
        }
        if (!Object.keys(scores).length) return;

        roundIds.add(roundId);
        rounds.push({
          id: roundId,
          index: Number.isFinite(Number(rawRound.index)) ? Number(rawRound.index) : position + 1,
          time,
          multiplier,
          playerMultipliers,
          scores
        });
      });
    }

    rounds.sort((a, b) => a.index - b.index);
    rounds.forEach((round, index) => {
      round.index = index + 1;
    });

    return { id, name, createdAt, archived, players, rounds };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const fresh = createFreshState();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
        } catch (error) {
          lastStorageError = error;
        }
        return fresh;
      }
      const parsed = JSON.parse(raw);
      const clean = sanitizeState(parsed);
      return clean || createFreshState();
    } catch (error) {
      lastStorageError = error;
      return createFreshState();
    }
  }

  function storageFailureReason() {
    const name = lastStorageError && lastStorageError.name ? lastStorageError.name : '';
    const message = lastStorageError && lastStorageError.message ? String(lastStorageError.message) : '';
    if (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED') return '本机存储空间已满';
    if (name === 'SecurityError' || name === 'NotAllowedError') return '浏览器禁止了本地存储';
    if (!name && !message) return '浏览器拒绝写入';
    return `${name}${message ? `：${message}` : ''}`;
  }

  function storageFailureHint() {
    const name = lastStorageError && lastStorageError.name ? lastStorageError.name : '';
    if (name === 'QuotaExceededError' || name === 'NS_ERROR_DOM_QUOTA_REACHED') {
      return '请清理本站数据后重试';
    }
    if (name === 'SecurityError' || name === 'NotAllowedError') {
      return '请关闭无痕模式、允许网站数据，或用普通浏览器打开';
    }
    return '请换用 Chrome / Safari 普通窗口打开';
  }

  function storageFailureText(prefix) {
    return `${prefix}（${storageFailureReason()}，${storageFailureHint()}）`;
  }

  function probeStorage() {
    try {
      const key = '__gandengyan_storage_probe__';
      localStorage.setItem(key, '1');
      localStorage.removeItem(key);
      lastStorageError = null;
      return true;
    } catch (error) {
      lastStorageError = error;
      return false;
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      return true;
    } catch (error) {
      lastStorageError = error;
      return false;
    }
  }

  function currentSession() {
    return state.sessions.find((s) => s.id === state.currentSessionId) || state.sessions[0];
  }

  function sessionById(id) {
    return state.sessions.find((s) => s.id === id) || null;
  }

  function activePlayers(session) {
    return session.players.filter((p) => p.active);
  }

  function sortedRounds(session) {
    return [...session.rounds].sort((a, b) => a.index - b.index);
  }

  function roundScoreSum(round) {
    return Object.values(round.scores).reduce((sum, score) => sum + Number(score || 0), 0);
  }

  function sessionBalanced(session) {
    return session.rounds.every((round) => roundScoreSum(round) === 0);
  }

  function totalsFor(session) {
    const totals = new Map(session.players.map((player) => [player.id, 0]));
    const played = new Map(session.players.map((player) => [player.id, 0]));

    for (const round of session.rounds) {
      for (const [playerId, score] of Object.entries(round.scores)) {
        if (!totals.has(playerId)) continue;
        totals.set(playerId, totals.get(playerId) + Number(score || 0));
        played.set(playerId, played.get(playerId) + 1);
      }
    }
    return { totals, played };
  }

  function rankedPlayers(session) {
    const { totals, played } = totalsFor(session);
    return session.players
      .map((player) => ({
        player,
        total: totals.get(player.id) || 0,
        played: played.get(player.id) || 0
      }))
      .sort((a, b) => {
        if (b.total !== a.total) return b.total - a.total;
        return a.player.name.localeCompare(b.player.name, 'zh-CN');
      });
  }

  function nextSessionName(sessions) {
    let max = 0;
    for (const session of sessions) {
      const match = /^第\s*(\d+)\s*场$/.exec(session.name);
      if (match) max = Math.max(max, Number(match[1]));
    }
    return `第 ${Math.max(max, sessions.length) + 1} 场`;
  }

  function setupManifest() {
    try {
      const pageUrl = location.href.split('#')[0].split('?')[0];
      const slash = pageUrl.lastIndexOf('/');
      const scope = slash >= 0 ? pageUrl.slice(0, slash + 1) : pageUrl;
      const manifest = {
        id: 'gandengyan-scorekeeper-v1',
        name: '干瞪眼计分器',
        short_name: '干瞪眼',
        description: '离线可用的干瞪眼牌局计分器',
        lang: 'zh-CN',
        start_url: pageUrl,
        scope,
        display: 'standalone',
        orientation: 'portrait',
        background_color: '#f3efe6',
        theme_color: '#0d6b4f',
        icons: [
          { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' },
          { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' },
          { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    } catch (_) {}
  }

  function renderHeader(session) {
    const count = session.rounds.length;
    sessionPill.innerHTML = `
      <span class="session-dot" aria-hidden="true"></span>
      <span class="session-name">${escapeHTML(session.name)}</span>
      <span class="session-rounds">${count} 局</span>
      ${icon('chevron', 14)}
    `;
    sessionPill.setAttribute('aria-label', `当前场次 ${session.name}，${count} 局，查看场次`);
  }

  function render(options = {}) {
    const session = currentSession();
    if (!session) return;
    const scrollTop = main.scrollTop;

    renderHeader(session);
    tabButtons.forEach((button) => {
      const isActive = button.dataset.tab === ui.tab;
      button.classList.toggle('is-active', isActive);
      if (isActive) {
        button.setAttribute('aria-current', 'page');
      } else {
        button.removeAttribute('aria-current');
      }
    });

    if (ui.tab === 'entry') {
      main.innerHTML = entryView(session);
      updateEntryComputed();
    } else if (ui.tab === 'history') {
      main.innerHTML = historyView(session);
    } else if (ui.tab === 'players') {
      main.innerHTML = playersView(session);
    } else if (ui.tab === 'sessions') {
      main.innerHTML = sessionsView(session);
    } else {
      main.innerHTML = summaryView(session);
    }

    if (options.keepScroll) {
      main.scrollTop = scrollTop;
    } else {
      main.scrollTop = 0;
    }
  }

  function switchTab(tab) {
    if (!['summary', 'entry', 'history', 'players', 'sessions'].includes(tab)) return;
    ui.tab = tab;
    render();
  }

  function summaryView(session) {
    const ranked = rankedPlayers(session);
    const active = activePlayers(session);
    const rounds = sortedRounds(session);
    const top = rounds.length && ranked.length ? ranked[0] : null;
    const balanced = sessionBalanced(session);
    const totalSum = ranked.reduce((sum, item) => sum + item.total, 0);

    let primaryAction;
    let secondaryAction;
    if (active.length >= 2) {
      primaryAction = `<button class="btn btn-primary" type="button" data-action="switch-tab" data-tab="entry">${icon('plus', 18)}记录本局</button>`;
      secondaryAction = `<button class="btn btn-secondary" type="button" data-action="switch-tab" data-tab="history">${icon('clock', 17)}查看历史</button>`;
    } else if (session.players.length === 0) {
      primaryAction = `<button class="btn btn-primary" type="button" data-action="open-add-player">${icon('plus', 18)}添加第一位玩家</button>`;
      secondaryAction = `<button class="btn btn-secondary" type="button" data-action="switch-tab" data-tab="players">玩家管理</button>`;
    } else if (active.length === 0) {
      primaryAction = `<button class="btn btn-primary" type="button" data-action="switch-tab" data-tab="players">${icon('users', 18)}启用玩家</button>`;
      secondaryAction = `<button class="btn btn-secondary" type="button" data-action="open-add-player">添加玩家</button>`;
    } else {
      primaryAction = `<button class="btn btn-primary" type="button" data-action="open-add-player">${icon('plus', 18)}再添加一位玩家</button>`;
      secondaryAction = `<button class="btn btn-secondary" type="button" data-action="switch-tab" data-tab="players">玩家管理</button>`;
    }

    const heroName = top ? top.player.name : (session.players.length ? '等待第一局' : '等待开局');
    const heroScore = top ? formatSigned(top.total) : '0';
    const heroScoreClass = top ? (top.total < 0 ? 'is-negative' : '') : 'is-empty';

    let leaderboard;
    if (!session.players.length) {
      leaderboard = `
        <div class="empty">
          <div class="empty-mark" aria-hidden="true">干</div>
          <h3>牌局还没开桌</h3>
          <p>先添加玩家。至少两名在场玩家就能开始记分，中途加入也从 0 分算起。</p>
          <button class="btn btn-primary" type="button" data-action="open-add-player">${icon('plus', 18)}添加玩家</button>
        </div>
      `;
    } else {
      let previous = null;
      let rank = 0;
      const rows = ranked.map((item, index) => {
        if (index === 0 || item.total !== previous) {
          rank = index + 1;
          previous = item.total;
        }
        const podium = rank <= 3 ? ` podium-${rank}` : '';
        const leading = rounds.length && rank === 1 && item.total > 0 ? ' is-leading' : '';
        const inactiveBadge = item.player.active ? '' : '<span class="badge">已停用</span>';
        return `
          <li class="leader-row${leading}">
            <span class="rank${podium}">${rank}</span>
            <span class="avatar ${toneFor(item.player.name)}" aria-hidden="true">${escapeHTML(initialOf(item.player.name))}</span>
            <span class="player-block">
              <span class="player-name"><span class="name-text">${escapeHTML(item.player.name)}</span>${inactiveBadge}</span>
              <span class="player-meta">参与 ${item.played} 局 · ${item.player.active ? '在场' : '保留历史分'}</span>
            </span>
            <span class="total ${scoreClass(item.total)}">${formatSigned(item.total)}</span>
          </li>
        `;
      }).join('');

      leaderboard = `
        <div class="card-head">
          <div>
            <h2>本场排行</h2>
            <p>按累计总分从高到低</p>
          </div>
          <span class="count">${session.players.length} 人</span>
        </div>
        <ol class="leader-list">${rows}</ol>
        ${rounds.length ? `
          <div class="list-foot">
            ${icon(totalSum === 0 ? 'check' : 'info', 14)}
            ${totalSum === 0 ? '账目平衡 · 所有人总分之和为 0' : '账目未平，请检查历史记录'}
          </div>
        ` : ''}
      `;
    }

    const lowActiveNotice = session.players.length > 0 && active.length < 2
      ? `<div class="notice">${icon('info', 15)}<span>至少需要 2 名<strong>在场玩家</strong>才能记录新的一局。${active.length === 1 ? '再添加或启用一位玩家即可开局。' : '启用已有玩家或添加新玩家。'}</span></div>`
      : '';

    return `
      <div class="view">
        <section class="hero" aria-label="本场概况">
          <div class="hero-top">
            <span class="hero-kicker">本场战况</span>
            <span class="hero-session">${escapeHTML(session.name)} · ${rounds.length} 局</span>
          </div>
          <div class="hero-main">
            <div style="min-width:0">
              <span class="hero-label">${top ? '当前领先' : '牌桌状态'}</span>
              <strong class="hero-name">${escapeHTML(heroName)}</strong>
            </div>
            <span class="hero-score ${top ? heroScoreClass : 'is-empty'}">${heroScore}</span>
          </div>
          <div class="hero-stats">
            <div><span>已完成</span><strong>${rounds.length} 局</strong></div>
            <div><span>在场玩家</span><strong>${active.length} 人</strong></div>
            <div><span>账目</span><strong class="${balanced ? 'good' : ''}">${balanced ? '已平' : '待核'}</strong></div>
          </div>
        </section>

        <div class="summary-actions">${primaryAction}${secondaryAction}</div>
        ${lowActiveNotice}

        <section class="section-card summary-card" aria-label="本场排行">
          ${leaderboard}
        </section>

        <div class="local-note">${icon('info', 13)}数据只保存在本机，可离线使用</div>
      </div>
    `;
  }

  function renderScorePlayerBlock(player, total, isWinner = false) {
    return `
      <div class="player-block">
        <span class="avatar ${toneFor(player.name)}" aria-hidden="true">${escapeHTML(initialOf(player.name))}</span>
        <span class="player-block">
          <span class="player-name"><span class="name-text">${escapeHTML(player.name)}</span>${isWinner ? '<span class="badge gold">赢家</span>' : ''}</span>
          <span class="player-meta">累计 ${formatSigned(total)}</span>
        </span>
      </div>
    `;
  }

  function renderAmountOptions(player, value) {
    const selected = String(value ?? '0');
    return AMOUNT_OPTIONS.map((amount) => {
      const active = selected === String(amount);
      return `
        <button class="amount-option ${active ? 'is-active' : ''}" type="button" data-action="pick-amount" data-player-id="${escapeAttr(player.id)}" data-amount="${amount}" aria-pressed="${active}" aria-label="${escapeAttr(player.name)} 本局输 ${amount} 分">${amount}</button>
      `;
    }).join('');
  }

  function renderRowMultiplierControl(player, value) {
    const multiplier = normalizeMultiplier(value, 1);
    return `
      <div class="row-multiplier-controls" role="group" aria-label="${escapeAttr(player.name)} 个人倍数">
        <span class="control-label">倍数</span>
        ${ROW_MULTIPLIERS.map((option) => {
          const active = multiplier === option;
          return `
            <button class="row-mult-btn ${active ? 'is-active' : ''}" type="button" data-action="set-row-multiplier" data-player-id="${escapeAttr(player.id)}" data-multiplier="${option}" aria-pressed="${active}">×${option}</button>
          `;
        }).join('')}
        <label class="row-mult-custom" title="自定义个人倍数">
          <span aria-hidden="true">×</span>
          <input class="row-multiplier-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" data-entry-row-multiplier data-player-id="${escapeAttr(player.id)}" value="${escapeAttr(String(multiplier))}" aria-label="${escapeAttr(player.name)} 自定义个人倍数">
        </label>
      </div>
    `;
  }

  function entryView(session) {
    const active = activePlayers(session);
    const rounds = sortedRounds(session);
    const nextRound = rounds.length + 1;
    const mode = ui.draft.mode;

    if (ui.draft.winnerId && !active.some((p) => p.id === ui.draft.winnerId)) {
      ui.draft.winnerId = null;
    }

    const modeSwitch = `
      <div class="mode-switch" role="group" aria-label="录入方式">
        <button class="mode-btn ${mode === 'normal' ? 'is-active' : ''}" type="button" data-action="set-mode" data-mode="normal" aria-pressed="${mode === 'normal'}">普通录入</button>
        <button class="mode-btn ${mode === 'quick' ? 'is-active' : ''}" type="button" data-action="set-mode" data-mode="quick" aria-pressed="${mode === 'quick'}">快捷结算</button>
      </div>
    `;

    if (active.length < 2) {
      return `
        <div class="view">
          <div class="view-head">
            <div>
              <span class="eyebrow">${escapeHTML(session.name)}</span>
              <h1>记一局</h1>

      <div class="field-block">

          <strong>本局倍数</strong>
          <small>公共倍数，与个人倍数相乘</small>

          <button class="multiplier-btn ${customMultiplierActive ? 'is-active' : ''}" type="button" data-action="set-custom-multiplier" aria-pressed="${customMultiplierActive}">自定义</button>
        </div>

              <span aria-hidden="true">×</span>

            </span>

    let formBody = '';
    if (mode === 'normal') {

      const preview = computeNormal(session);
      const winner = preview.winner;
      formBody = `

        <div class="score-list">
          ${active.map((player) => {

      `;
    } else {
      const winner = active.find((p) => p.id === ui.draft.winnerId) || null;
      const losers = winner ? active.filter((p) => p.id !== winner.id) : [];
      const { totals } = totalsFor(session);
      formBody = `

                <span class="mini-avatar ${toneFor(player.name)}" aria-hidden="true">${escapeHTML(initialOf(player.name))}</span>
                <span>${escapeHTML(player.name)}</span>

          </div>
        </div>
        ${winner ? `

  function computeNormal(session) {
    const active = activePlayers(session);
    const roundMultiplier = normalizeMultiplier(ui.draft.multiplier);
    const winner = active.find((player) => ui.draft.signs[player.id] === 1) || null;
    const items = active.map((player) => {
      const isWinner = Boolean(winner && player.id === winner.id);
      const amount = Number.parseInt(ui.draft.amounts[player.id] || '0', 10) || 0;
      const rowMultiplier = isWinner ? 1 : normalizeMultiplier(ui.draft.rowMultipliers[player.id], 1);
      const final = isWinner ? 0 : -amount * roundMultiplier * rowMultiplier;
      return { player, isWinner, amount, sign: isWinner ? 1 : -1, rowMultiplier, final };
    });
    const losers = items.filter((item) => !item.isWinner);
    const winnerItem = items.find((item) => item.isWinner) || null;
    const winnerTotal = losers.reduce((acc, item) => acc + Math.abs(item.final), 0);
    if (winnerItem) winnerItem.final = winnerTotal;
    const sum = items.reduce((acc, item) => acc + item.final, 0);
    const valid = active.length >= 2 && Boolean(winner);
    const scores = {};
    const playerMultipliers = {};
    items.forEach((item) => {
      scores[item.player.id] = item.final;
      playerMultipliers[item.player.id] = item.rowMultiplier;
    });
    const byId = {};
    items.forEach((item) => {
      byId[item.player.id] = item;
    });
    return { items, losers, winner, winnerTotal, sum, valid, scores, byId, playerMultipliers, roundMultiplier };
  }

  function computeQuick(session) {
    const active = activePlayers(session);
    const winner = active.find((player) => player.id === ui.draft.winnerId) || null;
    const roundMultiplier = normalizeMultiplier(ui.draft.multiplier);
    const losers = [];
    let total = 0;
    if (winner) {
      for (const player of active) {
        if (player.id === winner.id) continue;
        const remaining = Number.parseInt(ui.draft.remaining[player.id] || '0', 10) || 0;
        const rowMultiplier = normalizeMultiplier(ui.draft.rowMultipliers[player.id], 1);
        const loss = remaining * roundMultiplier * rowMultiplier;
        total += loss;
        losers.push({ player, remaining, rowMultiplier, score: -loss });
      }
    }
    const scores = {};
    const playerMultipliers = {};
    if (winner) {
      scores[winner.id] = total;
      playerMultipliers[winner.id] = 1;
      losers.forEach((loss) => {
        scores[loss.player.id] = loss.score;
        playerMultipliers[loss.player.id] = loss.rowMultiplier;
      });
    }
    return { winner, losers, total, valid: Boolean(winner), scores, playerMultipliers, roundMultiplier };
  }

  function updateEntryComputed() {
    if (ui.tab !== 'entry') return;
    const session = currentSession();
    const valueEl = document.getElementById('balance-value');
    const statusEl = document.getElementById('balance-status');
    const saveBtn = document.getElementById('save-round-btn');
    if (!session || !valueEl || !statusEl || !saveBtn) return;

    const nextRound = session.rounds.length + 1;
    saveBtn.textContent = `保存第 ${nextRound} 局`;

    if (ui.draft.mode === 'normal') {
      const result = computeNormal(session);
      document.querySelectorAll('[data-row-result]').forEach((el) => {
        const item = result.byId[el.dataset.playerId];
        if (!item) {
          el.textContent = '';
          el.className = 'row-calc';
          return;
        }
        if (item.isWinner) {
          el.textContent = `收下 ${result.losers.length} 位输家 · 自动计算`;
          el.className = 'row-calc pos';
          return;
        }
        const personal = item.rowMultiplier > 1 ? `个人 ×${item.rowMultiplier} · ` : '';
        el.textContent = `${personal}计入 ${formatSigned(item.final)}`;
        el.className = `row-calc ${scoreClass(item.final)}`;
      });
      document.querySelectorAll('[data-winner-auto]').forEach((el) => {
        const item = result.byId[el.dataset.playerId];
        if (!item) return;
        el.textContent = formatSigned(item.final);
        el.className = `winner-auto-value ${scoreClass(item.final)}`;
      });

      if (!result.winner) {
        valueEl.textContent = formatSigned(result.sum);
        valueEl.className = `balance-value ${scoreClass(result.sum)}`;
        statusEl.textContent = '先点选一位赢家，赢家自动收下所有输家的总分';
        statusEl.className = 'is-bad';
      } else {
        valueEl.textContent = '0';
        valueEl.className = 'balance-value zero';
        statusEl.textContent = `赢家 ${result.winner.name} ${formatSigned(result.winnerTotal)}，自动平衡`;
        statusEl.className = 'is-good';
      }
      saveBtn.disabled = !result.valid;
    } else {
      const result = computeQuick(session);
      document.querySelectorAll('[data-row-result]').forEach((el) => {
        const loss = result.losers.find((item) => item.player.id === el.dataset.playerId);
        if (!loss) {
          el.textContent = '';
          el.className = 'row-calc';
          return;
        }
        const personal = loss.rowMultiplier > 1 ? `个人 ×${loss.rowMultiplier} · ` : '';
        el.textContent = `${personal}计入 ${formatSigned(loss.score)}`;
        el.className = `row-calc ${scoreClass(loss.score)}`;
      });
      const winnerScore = document.querySelector('[data-winner-score]');
      if (winnerScore) {
        winnerScore.textContent = formatSigned(result.total);
        winnerScore.className = `winner-score ${result.total ? 'pos' : 'zero'}`;
      }

      valueEl.textContent = '0';
      valueEl.className = 'balance-value zero';
      if (!result.winner) {
        statusEl.textContent = '先选出赢家';
        statusEl.className = '';
      } else if (result.total === 0) {
        statusEl.textContent = '本局合计为 0，可以保存';
        statusEl.className = 'is-good';
      } else {
        statusEl.textContent = `赢家 ${result.winner.name} +${result.total}，自动平衡`;
        statusEl.className = 'is-good';
      }
      saveBtn.disabled = !result.valid;
    }
  }

  function saveRound() {
    const session = currentSession();
    if (!session) return;
    const result = ui.draft.mode === 'normal' ? computeNormal(session) : computeQuick(session);
    if (!result.valid) {
      showToast(ui.draft.mode === 'normal' ? '先点选一位赢家' : '先选出赢家');
      return;
    }

    const round = {
      id: uid('r'),
      index: session.rounds.length + 1,
      time: nowISO(),
      multiplier: normalizeMultiplier(ui.draft.multiplier),
      playerMultipliers: { ...result.playerMultipliers },
      scores: { ...result.scores }
    };
    session.rounds.push(round);
    const saved = saveState();
    const roundNumber = round.index;
    ui.draft = newDraft(ui.draft.mode);
    render();
    showToast(saved ? `已记录第 ${roundNumber} 局` : storageFailureText('已记录，但本机存储失败'), {
      label: '查看排行',
      onClick: () => switchTab('summary')
    });
  }

  function openDialog({ title, subtitle = '', body = '', footer = '', tall = false, onOpen = null }) {
    closeDialog();
    dialogRoot.innerHTML = `
      <dialog class="app-dialog ${tall ? 'dialog-tall' : ''}" aria-labelledby="dialog-title">
        <div class="dialog-card">
          <div class="dialog-head">
            <div>
              <h2 id="dialog-title">${escapeHTML(title)}</h2>
              ${subtitle ? `<p>${escapeHTML(subtitle)}</p>` : ''}
            </div>
            <button class="icon-btn dialog-close" type="button" data-action="close-dialog" aria-label="关闭">${icon('close', 19)}</button>
          </div>
          <div class="dialog-body">${body}</div>
          ${footer ? `<div class="dialog-foot">${footer}</div>` : ''}
        </div>
      </dialog>
    `;
    const dialog = dialogRoot.querySelector('dialog');
    if (!dialog) return null;

    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
    dialog.addEventListener('close', () => {
      if (dialogRoot.contains(dialog)) dialogRoot.innerHTML = '';
    });

    try {
      dialog.showModal();
    } catch (_) {
      dialog.setAttribute('open', '');
    }

    if (typeof onOpen === 'function') {
      onOpen(dialog);
    }
    return dialog;
  }

  function closeDialog() {
    const dialog = dialogRoot.querySelector('dialog[open]');
    if (dialog) dialog.close();
    else dialogRoot.innerHTML = '';
  }

  function showToast(message, action = null) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    if (toastTimer) clearTimeout(toastTimer);

    const host = document.querySelector('dialog[open]') || document.body;
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.setAttribute('role', 'status');

    const messageNode = document.createElement('span');
    messageNode.className = 'toast-message';
    messageNode.textContent = message;
    toast.appendChild(messageNode);

    if (action && action.label && typeof action.onClick === 'function') {
      toast.classList.add('has-action');
      const actionButton = document.createElement('button');
      actionButton.type = 'button';
      actionButton.textContent = action.label;
      actionButton.addEventListener('click', () => {
        action.onClick();
        toast.remove();
      });
      toast.appendChild(actionButton);
    }

    host.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('is-visible'));
    toastTimer = window.setTimeout(() => {
      toast.classList.remove('is-visible');
      window.setTimeout(() => toast.remove(), 220);
    }, action ? 4200 : 2400);
  }

  function addPlayer(name) {
    const session = currentSession();
    if (!session) return { ok: false, error: '当前场次不可用' };
    const clean = String(name || '').trim().replace(/\s+/g, ' ');
    if (!clean) return { ok: false, error: '请输入玩家姓名' };
    if (clean.length > 16) return { ok: false, error: '玩家姓名最多 16 个字符' };
    if (session.players.some((player) => player.name === clean)) {
      return { ok: false, error: '这个姓名已经存在，请换一个' };
    }
    const player = createPlayer(clean, true);
    session.players.push(player);
    const saved = saveState();
    return { ok: true, player, saved };
  }

  function renamePlayer(playerId, name) {
    const session = currentSession();
    if (!session) return { ok: false, error: '当前场次不可用' };
    const player = session.players.find((item) => item.id === playerId);
    if (!player) return { ok: false, error: '玩家不存在' };
    const clean = String(name || '').trim().replace(/\s+/g, ' ');
    if (!clean) return { ok: false, error: '请输入玩家姓名' };
    if (clean.length > 16) return { ok: false, error: '玩家姓名最多 16 个字符' };
    if (session.players.some((item) => item.id !== playerId && item.name === clean)) {
      return { ok: false, error: '这个姓名已经存在，请换一个' };
    }
    player.name = clean;
    const saved = saveState();
    return { ok: true, player, saved };
  }

  function deletePlayerById(playerId) {
    const session = currentSession();
    if (!session) return;
    const player = session.players.find((item) => item.id === playerId);

    const name = player.name;
    const played = session.rounds.filter((round) => Object.prototype.hasOwnProperty.call(round.scores, playerId)).length;

    session.players = session.players.filter((item) => item.id !== playerId);
    session.rounds.forEach((round) => {
      delete round.scores[playerId];
      if (round.playerMultipliers) delete round.playerMultipliers[playerId];
    });
    const before = session.rounds.length;
    session.rounds = session.rounds.filter((round) => Object.keys(round.scores).length > 0);
    if (session.rounds.length !== before) {
      session.rounds.forEach((round, index) => {
        round.index = index + 1;
      });
    }

    delete ui.draft.amounts[playerId];
    delete ui.draft.signs[playerId];
    delete ui.draft.remaining[playerId];
    delete ui.draft.rowMultipliers[playerId];
    if (ui.draft.winnerId === playerId) ui.draft.winnerId = null;

  function settlementText(session) {
    const ranked = rankedPlayers(session);
    const rounds = sortedRounds(session);
    const lines = [`【干瞪眼结算】${session.name}`, `共 ${rounds.length} 局 · ${formatDateTime(session.createdAt, true)}`, ''];
    ranked.forEach((item, index) => {
      lines.push(`${index + 1}. ${item.player.name}  ${formatSigned(item.total)}`);
    });
    const total = ranked.reduce((sum, item) => sum + item.total, 0);
    lines.push('');
    lines.push(`合计 ${total} 分${total === 0 ? '，账目已平 ✅' : '，请核对 ⚠️'}`);
    return lines.join('\n');
  }

  async function copyToClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) {}

    try {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      textarea.style.top = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      const ok = document.execCommand('copy');
      textarea.remove();
      return ok;
    } catch (_) {
      return false;
    }
  }

  async function copySettlement(session) {
    if (!session || !session.players.length) {

    const ok = await copyToClipboard(text);

      return;

  function csvCell(value) {

  function csvForSession(session) {
    const rounds = sortedRounds(session);
    const { totals } = totalsFor(session);
    const header = [
      '玩家',
      '状态',
      ...rounds.map((round) => `第 ${round.index} 局（${formatDateTime(round.time)}，×${round.multiplier}）`),
      '总分'
    ];
    const rows = session.players.map((player) => [
      player.name,
      player.active ? '在场' : '已停用',
      ...rounds.map((round) => (Object.prototype.hasOwnProperty.call(round.scores, player.id) ? round.scores[player.id] : 0)),
      totals.get(player.id) || 0
    ]);
    return '﻿' + [header, ...rows].map((row) => row.map(csvCell).join(',')).join('\r\n');
  }

  function exportSessionCSV(session) {
    if (!session || !session.players.length) {
      showToast('还没有可导出的玩家');
      return;
    }
    const csv = csvForSession(session);
    const safeName = session.name.replace(/[\\/:*?"<>|]/g, '-');
    const date = new Date().toISOString().slice(0, 10);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `${safeName}_干瞪眼计分_${date}.csv`;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('CSV 已导出，可用表格软件打开');
  }

  function updateEditComputed() {
    const form = document.getElementById('edit-round-form');
    const valueEl = document.getElementById('edit-balance-value');
    const statusEl = document.getElementById('edit-balance-status');
    const saveBtn = document.getElementById('save-edit-btn');
    if (!form || !valueEl || !statusEl || !saveBtn) return;

    let sum = 0;
    let count = 0;
    form.querySelectorAll('[data-edit-row]').forEach((row) => {
      const input = row.querySelector('[data-edit-amount]');
      const amount = Number.parseInt((input && input.value) || '0', 10) || 0;
      const sign = row.dataset.sign === '-1' ? -1 : 1;
      const score = amount * sign;
      sum += score;
      count += 1;
    });

    valueEl.textContent = formatSigned(sum);
    valueEl.className = scoreClass(sum);
    if (sum === 0) {
      statusEl.textContent = '账目平衡，可保存 0 分';
      statusEl.className = 'is-good';
    } else {
      statusEl.textContent = `还差 ${formatSigned(-sum)}`;
      statusEl.className = 'is-bad';
    }
    saveBtn.disabled = !(sum === 0 && count >= 2);
  }

  function saveEditedRound(form) {
    const session = currentSession();
    if (!session) return;
    const roundId = form.dataset.roundId;
    const round = session.rounds.find((item) => item.id === roundId);
    if (!round) return;

    const scores = {};
    let sum = 0;
    let count = 0;
    form.querySelectorAll('[data-edit-row]').forEach((row) => {
      const input = row.querySelector('[data-edit-amount]');
      const amount = Number.parseInt((input && input.value) || '0', 10) || 0;
      const sign = row.dataset.sign === '-1' ? -1 : 1;
      const score = amount * sign;
      scores[row.dataset.playerId] = score;
      sum += score;
      count += 1;
    });

    if (sum !== 0 || count < 2) {
      showToast('分数合计必须为 0');
      return;
    }

    round.scores = scores;
    const saved = saveState();
    closeDialog();
    render({ keepScroll: true });
    showToast(saved ? `第 ${round.index} 局已更新` : storageFailureText('已更新，但本机存储失败'));
  }
